spring.application.name=Lab8_20212472

spring.datasource.url=jdbc:mysql://localhost:3306/space_missions?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.mode=HTML

logging.level.com.example.lab8_20212472=DEBUG
logging.level.org.springframework.web=DEBUG

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

server.port=8080
