<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${planeta.id != null ? 'Editar Planeta' : 'Nuevo Planeta'}">Formulario Planeta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-rocket"></i> Exploración Espacial
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="fas fa-home"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/planetas}">
                            <i class="fas fa-globe"></i> Planetas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/tripulacion}">
                            <i class="fas fa-users"></i> Tripulación
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/expediciones}">
                            <i class="fas fa-space-shuttle"></i> Expediciones
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 class="mb-0">
                            <i class="fas fa-globe text-primary"></i>
                            <span th:text="${planeta.id != null ? 'Editar Planeta' : 'Nuevo Planeta'}">Formulario Planeta</span>
                        </h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/planetas/guardar}" th:object="${planeta}" method="post">
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nombre" class="form-label">
                                        <i class="fas fa-tag"></i> Nombre del Planeta *
                                    </label>
                                    <input type="text" class="form-control" th:field="*{nombre}" 
                                           id="nombre" placeholder="Ej: Kepler-442b" required>
                                    <div th:if="${#fields.hasErrors('nombre')}" class="text-danger">
                                        <small th:errors="*{nombre}">Error en nombre</small>
                                    </div>
                                </div>
                                  <div class="col-md-6 mb-3">
                                    <label for="tipoPlaneta" class="form-label">
                                        <i class="fas fa-layer-group"></i> Tipo de Planeta *
                                    </label>
                                    <select class="form-select" th:field="*{tipoPlaneta}" id="tipoPlaneta" required>
                                        <option value="">Seleccione un tipo</option>
                                        <option value="Rocoso">Rocoso</option>
                                        <option value="Gaseoso">Gaseoso</option>
                                        <option value="Helado">Helado</option>
                                        <option value="Desértico">Desértico</option>
                                        <option value="Oceánico">Oceánico</option>
                                        <option value="Terrestre">Terrestre</option>
                                        <option value="Super-Tierra">Super-Tierra</option>
                                    </select>
                                    <div th:if="${#fields.hasErrors('tipoPlaneta')}" class="text-danger">
                                        <small th:errors="*{tipoPlaneta}">Error en tipo de planeta</small>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="gravedadRelativa" class="form-label">
                                        <i class="fas fa-weight-hanging"></i> Gravedad Relativa (respecto a la Tierra) *
                                    </label>
                                    <input type="number" step="0.01" min="0" class="form-control" th:field="*{gravedadRelativa}" 
                                           id="gravedadRelativa" placeholder="Ej: 1.2" required>
                                    <div class="form-text">1.0 = gravedad terrestre</div>
                                    <div th:if="${#fields.hasErrors('gravedadRelativa')}" class="text-danger">
                                        <small th:errors="*{gravedadRelativa}">Error en gravedad relativa</small>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="habitable" class="form-label">
                                        <i class="fas fa-seedling"></i> ¿Es Habitable? *
                                    </label>
                                    <select class="form-select" th:field="*{habitable}" id="habitable" required>
                                        <option value="">Seleccione una opción</option>
                                        <option th:value="true">Sí - Planeta habitable</option>
                                        <option th:value="false">No - Planeta no habitable</option>
                                    </select>
                                    <div th:if="${#fields.hasErrors('habitable')}" class="text-danger">
                                        <small th:errors="*{habitable}">Error en habitabilidad</small>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="descripcion" class="form-label">
                                    <i class="fas fa-align-left"></i> Descripción
                                </label>
                                <textarea class="form-control" th:field="*{descripcion}" id="descripcion" 
                                          rows="4" placeholder="Descripción detallada del planeta..."></textarea>
                                <div th:if="${#fields.hasErrors('descripcion')}" class="text-danger">
                                    <small th:errors="*{descripcion}">Error en descripción</small>
                                </div>                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/planetas}" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> 
                                    <span th:text="${planeta.id != null ? 'Actualizar' : 'Guardar'}">Guardar</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
